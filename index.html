<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비키니시티 정류장 | 코끼리물범의 영화 추천</title>
  <meta name="description" content="버스를 기다리며 우연히 마주친 코끼리물범이 들려주는 비주얼노벨 감성 영화 추천 서비스">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 전체 배경 애니메이션 (해저 그라디언트 및 심해 오라) -->
  <div class="underwater-bg-fx">
    <div class="ocean-light-beam light-1"></div>
    <div class="ocean-light-beam light-2"></div>
    <div class="ocean-particles"></div>
  </div>

  <div class="app-layout">
    <!-- 1. 상단 내비게이션 및 헤더 바 -->
    <header class="app-header">
      <div class="header-left">
        <div class="bus-stop-badge">
          <span class="sign-emoji">🚏</span>
          <div class="bus-stop-text">
            <h1 class="header-title">비키니시티 104번 버스 정류장</h1>
            <p class="header-sub">코끼리물범과 함께하는 비주얼노벨 영화 추천</p>
          </div>
        </div>
      </div>

      <div class="header-center">
        <div class="bus-status-pill" id="busStatusPill">
          <span class="status-dot pulsing"></span>
          <span>104번 버스: <strong>도착 정보 없음</strong> (무기한 대기)</span>
        </div>
      </div>

      <div class="header-right">
        <!-- 사운드 토글 버튼 -->
        <button type="button" class="btn-top sound-toggle" id="btnSound" aria-label="효과음 켜기/끄기">
          <span class="icon" id="soundIcon">🔊</span>
          <span class="btn-text" id="soundLabel">효과음 ON</span>
        </button>

        <!-- 상단 고정 랜덤 추천 CTA -->
        <button type="button" class="btn-top btn-random-glow" id="btnRandom">
          <span class="icon">🎲</span>
          <span class="btn-text">아무거나 골라줘!</span>
        </button>
      </div>
    </header>

    <!-- 2. 장르 분류 탭 바 -->
    <nav class="genre-bar-container" aria-label="영화 장르 분류">
      <div class="genre-tabs-wrapper">
        <button type="button" class="genre-tab active" data-genre="all">
          <span class="g-emoji">✨</span>
          <span class="g-name">전체 장르</span>
          <span class="g-count">23</span>
        </button>
        <button type="button" class="genre-tab" data-genre="sf">
          <span class="g-emoji">🚀</span>
          <span class="g-name">SF · 판타지</span>
          <span class="g-count">4</span>
        </button>
        <button type="button" class="genre-tab" data-genre="action">
          <span class="g-emoji">💥</span>
          <span class="g-name">액션 · 모험</span>
          <span class="g-count">4</span>
        </button>
        <button type="button" class="genre-tab" data-genre="animation">
          <span class="g-emoji">🎨</span>
          <span class="g-name">애니메이션</span>
          <span class="g-count">4</span>
        </button>
        <button type="button" class="genre-tab" data-genre="drama">
          <span class="g-emoji">🎭</span>
          <span class="g-name">드라마 · 명작</span>
          <span class="g-count">3</span>
        </button>
        <button type="button" class="genre-tab" data-genre="romance">
          <span class="g-emoji">💖</span>
          <span class="g-name">로맨스 · 멜로</span>
          <span class="g-count">3</span>
        </button>
        <button type="button" class="genre-tab" data-genre="thriller">
          <span class="g-emoji">😱</span>
          <span class="g-name">스릴러 · 미스터리</span>
          <span class="g-count">3</span>
        </button>
        <button type="button" class="genre-tab" data-genre="comedy">
          <span class="g-emoji">🤣</span>
          <span class="g-name">코미디 · 힐링</span>
          <span class="g-count">2</span>
        </button>
      </div>
    </nav>

    <!-- 3. 메인 게임/비주얼노벨 스테이지 -->
    <main class="game-stage-wrapper">
      <div class="stage-frame">
        <div class="stage-container idle-mode" id="stageContainer">

          <!-- 배경 1: 평상시 대화 모드 (첫 번째 첨부 이미지: idle_bench_seal.png) -->
          <div class="stage-bg bg-idle active" id="bgIdle" title="클릭하여 코끼리물범과 대화하기">
            <div class="idle-click-hint">
              <span class="hint-icon">👆</span> 물범을 클릭하면 속마음을 들을 수 있어요
            </div>
          </div>

          <!-- 배경 2: 영화 소개 모드 (두 번째 첨부 이미지: 빈 벤치 bg_bench_empty.jpg) -->
          <div class="stage-bg bg-empty" id="bgEmpty"></div>

          <!-- 해저 물방울 파티클 레이어 -->
          <div class="bubble-layer" id="bubbleLayer"></div>

          <!-- 캐릭터 스프라이트 (세 번째 첨부 이미지: seal_sprite.png) -->
          <div class="seal-actor bench-position hidden" id="sealActor" role="button" tabindex="0" aria-label="코끼리물범 캐릭터">
            <div class="seal-img-wrapper">
              <img 
                src="images/seal_sprite.png" 
                alt="기다리는 코끼리물범" 
                class="seal-sprite-img"
                id="sealImg"
              >
            </div>
            <!-- 캐릭터 머리 위 실시간 말풍선 -->
            <div class="seal-speech-bubble" id="sealFloatBubble">
              <span id="sealFloatText">영차! 옆으로 비켜줬다!</span>
            </div>
          </div>

          <!-- 화면 중앙: 영화 포스터 및 줄거리 쇼케이스 카드 -->
          <div class="movie-showcase" id="movieShowcase" aria-live="polite">
            <!-- app.js에서 동적으로 생성 및 애니메이션 -->
          </div>
        </div>

        <!-- 4. 하단 비주얼노벨 대화창 (Visual Novel Dialogue Box) -->
        <section class="vn-dialogue-window" id="vnDialogueBox" aria-label="비주얼노벨 대화창">
          <div class="vn-box-header">
            <div class="speaker-pill" id="speakerBadge">
              <span class="seal-avatar-mini">🦭</span>
              <span class="speaker-name" id="speakerName">기다리는 코끼리물범</span>
              <span class="speaker-tag">비키니시티 정류장 터줏대감</span>
            </div>
            <div class="skip-hint">대화창 클릭 시 스킵 ⏩</div>
          </div>

          <div class="vn-box-body">
            <p class="dialogue-text-content" id="dialogueText">
              <!-- 타이핑 텍스트가 출력되는 위치 -->
            </p>
            <span class="typing-cursor"></span>
            <span class="advance-arrow" id="advanceArrow" aria-hidden="true">▼</span>
          </div>

          <!-- 대화창 하단 선택지 / 인터랙션 버튼 영역 -->
          <div class="vn-box-choices" id="dialogueChoices">
            <!-- app.js에서 상태에 따라 동적으로 버튼 렌더링 -->
          </div>
        </section>
      </div>
    </main>

    <!-- 5. 하단 풋터 -->
    <footer class="app-footer">
      <p class="footer-copy">
        🎬 비키니시티 버스 정류장에서 펼쳐지는 코끼리물범의 명작 영화 추천소 · 
        <span class="footer-tag">Visual Novel Interactive Web</span>
      </p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
